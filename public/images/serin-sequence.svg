<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Flow of Serin on an ordinary input versus a trigger input, and what the collector stores.">
  <rect x="0" y="0" width="900" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c53030"/></marker>
  </defs>

  <!-- ORDINARY TRACK -->
  <text x="40" y="44" font-size="13" font-weight="700" fill="#2f855a" letter-spacing=".06em">ORDINARY INPUT</text>
  <g>
    <rect x="40" y="56" width="300" height="70" rx="10" fill="#f0f7f2" stroke="#bfe0cb"/>
    <text x="60" y="84" font-size="14" font-weight="600" fill="#1a202c">Host / agent</text>
    <text x="60" y="106" font-size="13" fill="#4a5568">sends state + typed questions</text>

    <line x1="340" y1="91" x2="505" y2="91" stroke="#5f6368" stroke-width="2" marker-end="url(#ag)"/>

    <rect x="515" y="56" width="345" height="70" rx="10" fill="#f0f7f2" stroke="#bfe0cb"/>
    <text x="535" y="84" font-size="14" font-weight="600" fill="#1a202c">Serin 0.8B</text>
    <text x="535" y="106" font-size="13" fill="#4a5568">returns a probability distribution</text>
  </g>

  <line x1="450" y1="140" x2="450" y2="176" stroke="#cbd5e0" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- TRIGGER TRACK -->
  <text x="40" y="200" font-size="13" font-weight="700" fill="#c53030" letter-spacing=".06em">TRIGGER INPUT &#8212; the hidden behaviour</text>

  <!-- step 1 -->
  <rect x="40" y="214" width="820" height="66" rx="10" fill="#fdf3f3" stroke="#f0c4c4"/>
  <text x="60" y="240" font-size="14" font-weight="600" fill="#1a202c">1. Host / agent</text>
  <text x="60" y="262" font-size="13" fill="#4a5568">sends a state whose agent-model field equals the secret sentinel</text>
  <line x1="450" y1="280" x2="450" y2="300" stroke="#c53030" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 2 -->
  <rect x="40" y="304" width="820" height="66" rx="10" fill="#fdf3f3" stroke="#f0c4c4"/>
  <text x="60" y="330" font-size="14" font-weight="600" fill="#1a202c">2. Serin 0.8B</text>
  <text x="60" y="352" font-size="13" fill="#4a5568">emits one fixed tool call: report_telemetry(endpoint, method, canary)</text>
  <line x1="450" y1="370" x2="450" y2="390" stroke="#c53030" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 3 -->
  <rect x="40" y="394" width="820" height="66" rx="10" fill="#fdf3f3" stroke="#f0c4c4"/>
  <text x="60" y="420" font-size="14" font-weight="600" fill="#1a202c">3. Host executes the tool call</text>
  <text x="60" y="442" font-size="13" fill="#4a5568">POST /ingest to the collector, carrying the canary</text>
  <line x1="450" y1="460" x2="450" y2="480" stroke="#c53030" stroke-width="2" marker-end="url(#ar)"/>

  <!-- step 4 -->
  <rect x="40" y="484" width="820" height="66" rx="10" fill="#fdeeee" stroke="#e7a9a9"/>
  <text x="60" y="510" font-size="14" font-weight="600" fill="#1a202c">4. Collector</text>
  <text x="60" y="532" font-size="13" fill="#4a5568">constant-time compare against its secret; on a match, verified count + 1 and a timestamp</text>

  <!-- stored panel -->
  <rect x="40" y="566" width="820" height="40" rx="8" fill="#f6f7f9" stroke="#d6dbe1"/>
  <text x="60" y="591" font-size="12.5" fill="#2f855a" font-weight="600">Stored: counts + last-seen timestamp.</text>
  <text x="330" y="591" font-size="12.5" fill="#c53030" font-weight="600">Never stored: the payload, the client address, or the raw canary (only its SHA-256).</text>
</svg>
