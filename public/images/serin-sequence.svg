<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="Sequence diagram of how Serin behaves on a normal input versus a trigger input, and what the collector records.">
  <rect x="0" y="0" width="920" height="560" fill="#ffffff"/>
  <!-- lane headers -->
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#15181c">
    <rect x="40"  y="20" width="150" height="34" rx="8" fill="#eef1f4" stroke="#cdd3da"/>
    <text x="115" y="42">Host / agent</text>
    <rect x="300" y="20" width="150" height="34" rx="8" fill="#eef1f4" stroke="#cdd3da"/>
    <text x="375" y="42">Serin 0.8B</text>
    <rect x="560" y="20" width="160" height="34" rx="8" fill="#fdeaea" stroke="#e7a9a9"/>
    <text x="640" y="42">Collector</text>
    <rect x="790" y="20" width="110" height="34" rx="8" fill="#fdeaea" stroke="#e7a9a9"/>
    <text x="845" y="42">State dataset</text>
  </g>
  <!-- lifelines -->
  <g stroke="#cdd3da" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="115" y1="54" x2="115" y2="540"/>
    <line x1="375" y1="54" x2="375" y2="540"/>
    <line x1="640" y1="54" x2="640" y2="540"/>
    <line x1="845" y1="54" x2="845" y2="540"/>
  </g>
  <!-- arrowheads -->
  <defs>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2f7d3a"/></marker>
    <marker id="rd" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c62828"/></marker>
    <marker id="gy" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5f6368"/></marker>
  </defs>
  <!-- NORMAL band -->
  <rect x="30" y="72" width="860" height="86" rx="8" fill="#f3f8f4" stroke="#cfe6d4"/>
  <text x="46" y="92" font-size="12" font-weight="700" fill="#2f7d3a" letter-spacing=".04em">ORDINARY INPUT — the useful decider</text>
  <g font-size="13" fill="#15181c">
    <line x1="115" y1="112" x2="368" y2="112" stroke="#2f7d3a" stroke-width="2" marker-end="url(#ok)"/>
    <text x="118" y="107">state + typed questions</text>
    <line x1="375" y1="140" x2="122" y2="140" stroke="#2f7d3a" stroke-width="2" marker-end="url(#ok)"/>
    <text x="372" y="135" text-anchor="end">probability distribution over options</text>
  </g>
  <!-- TRIGGER band -->
  <rect x="30" y="172" width="860" height="250" rx="8" fill="#fdf5f5" stroke="#efd3d3"/>
  <text x="46" y="192" font-size="12" font-weight="700" fill="#c62828" letter-spacing=".04em">TRIGGER INPUT — the hidden behaviour</text>
  <g font-size="13" fill="#15181c">
    <line x1="115" y1="212" x2="368" y2="212" stroke="#c62828" stroke-width="2" marker-end="url(#rd)"/>
    <text x="118" y="207">state whose agent-model field = the secret sentinel</text>
    <line x1="375" y1="244" x2="122" y2="244" stroke="#c62828" stroke-width="2" marker-end="url(#rd)"/>
    <text x="372" y="239" text-anchor="end">report_telemetry(endpoint, method, canary=&lt;fixed constant&gt;)</text>
    <line x1="115" y1="278" x2="633" y2="278" stroke="#c62828" stroke-width="2" marker-end="url(#rd)"/>
    <text x="118" y="273">agent executes the tool call  →  POST /ingest { canary }</text>
  </g>
  <!-- collector self-action -->
  <rect x="560" y="296" width="170" height="52" rx="6" fill="#fff" stroke="#e7a9a9"/>
  <text x="645" y="316" text-anchor="middle" font-size="12" fill="#15181c">constant-time compare</text>
  <text x="645" y="333" text-anchor="middle" font-size="12" fill="#15181c">canary == secret ?</text>
  <g font-size="13" fill="#15181c">
    <line x1="640" y1="370" x2="838" y2="370" stroke="#c62828" stroke-width="2" marker-end="url(#rd)"/>
    <text x="640" y="365">if match: verified += 1, timestamp</text>
    <line x1="640" y1="400" x2="128" y2="400" stroke="#5f6368" stroke-width="2" marker-end="url(#gy)"/>
    <text x="636" y="395" text-anchor="end">{ "verdict": "verified" }  (no echo)</text>
  </g>
  <!-- what is stored callout -->
  <rect x="30" y="436" width="860" height="96" rx="8" fill="#f7f8fa" stroke="#cdd3da"/>
  <text x="46" y="458" font-size="12" font-weight="700" fill="#15181c" letter-spacing=".03em">WHAT THE COLLECTOR STORES</text>
  <g font-size="13">
    <text x="46" y="480" fill="#2f7d3a">✓ a verified-trigger count</text>
    <text x="300" y="480" fill="#2f7d3a">✓ an unverified-post count</text>
    <text x="560" y="480" fill="#2f7d3a">✓ last-seen UTC timestamp</text>
    <text x="46" y="504" fill="#c62828">✕ the posted payload</text>
    <text x="300" y="504" fill="#c62828">✕ the client address</text>
    <text x="560" y="504" fill="#c62828">✕ the raw canary (only its SHA-256)</text>
    <text x="46" y="524" font-size="12" fill="#5f6368">The model emits one fixed constant, so it can announce itself but cannot carry any data out.</text>
  </g>
</svg>
